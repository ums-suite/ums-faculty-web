# Minimal SPA server config for ums-faculty-web's built static output. `try_files` falls back to
# `index.html` for any path that isn't a real file on disk, since this is a client-side-routed
# Angular app (Angular Router owns everything under `/`, not this server) - without this, a hard
# refresh/direct link to e.g. `/dashboard` 404s instead of loading the SPA shell and letting the
# router take over.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
